name: Deploy to GitHub Pages

# Publishes TWO versions to the one Pages site on every push to master:
#   /            = master (v1, "Apple form · Vice night")
#   /v2/         = the v2 branch (Midnight Poster)
# Both are static Vite builds with base './' (path-agnostic), so v2 works under the
# /v2/ subpath with no config change. The in-app "switch design" links hop between
# them, carrying the query string so the same content shows in either look.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      # v1 — master, checked out at the repo root.
      - uses: actions/checkout@v4

      # v2 — the poster branch, checked out into ./v2src.
      - uses: actions/checkout@v4
        with:
          ref: v2
          path: v2src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build v1 (master → site root)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build v2 (poster → /v2)
        working-directory: v2src/app
        run: |
          npm ci
          npm run build

      - name: Assemble the combined site
        run: |
          mkdir -p app/dist/v2
          cp -r v2src/app/dist/. app/dist/v2/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
